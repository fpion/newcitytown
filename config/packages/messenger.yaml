framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Commands dispatched synchronously (switch to async when a worker is running)
            'App\Application\News\Command\CreateNewsCommand': sync
            'App\Application\News\Command\PublishNewsCommand': sync

            # Domain events dispatched synchronously to projectors
            'App\Domain\News\Event\NewsCreated': sync
            'App\Domain\News\Event\NewsPublished': sync
